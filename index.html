<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribuidora Smart</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Distribuidora Smart</h1>
    </header>

    <main class="container">
        <!-- Coluna da Esquerda (Formulários e Buscas) -->
        <div class="left-column">
            <section class="panel top-panels">
                <!-- Formulário de Cadastro -->
                <div class="card form-section">
                    <h2>Adicionar Produto</h2>
                    <form id="add-form">
                        <div class="barcode-wrapper">
                            <input type="text" id="add-barcode" placeholder="Código de Barras" required>
                            <button type="button" class="btn-api" onclick="fetchProductData('add')" title="Buscar nome na API">OK</button>
                        </div>
                        <input type="text" id="add-name" placeholder="Nome" required>
                        <input type="text" id="add-image-url" placeholder="URL da Imagem">
                        <input type="number" id="add-quantity" placeholder="Quantidade" required>
                        <input type="number" step="0.01" id="add-value" placeholder="Valor (R$)" required>
                        <button type="submit" class="btn-success">Cadastrar</button>
                    </form>
                </div>
            </section>

            <section class="panel">
                <div class="card search-section">
                    <h2>Buscar Produtos</h2>
                    <div class="search-controls">
                        <div class="search-group">
                            <input type="text" id="search-text" placeholder="Nome ou Código parcial...">
                            <button onclick="searchProducts()">Pesquisar Parcial</button>
                        </div>
                        <div class="search-group">
                            <input type="text" id="search-id" placeholder="Buscar por ID...">
                            <button onclick="searchById()">Buscar ID</button>
                        </div>
                        <div class="search-group">
                            <input type="text" id="search-exact-barcode" placeholder="Código de barras exato...">
                            <button onclick="searchByBarcode()">Buscar Código</button>
                        </div>
                        <button class="btn-secondary" onclick="loadProducts()">Limpar / Listar Todos</button>
                    </div>
                </div>
            </section>
        </div>

        <!-- Coluna da Direita (Tabela de Estoque) -->
        <div class="right-column">
            <section class="panel">
                <div class="card">
                    <h2>Estoque</h2>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Imagem</th>
                                    <th>Nome</th>
                                    <th>Cód. Barras</th>
                                    <th>Qtd.</th>
                                    <th>Valor (R$)</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="product-table-body">
                                <!-- Renderizado via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Modal de Edição (Oculto por padrão) -->
    <div id="edit-modal" class="modal hidden">
        <div class="modal-content card">
            <span class="close-btn" onclick="cancelUpdate()">&times;</span>
            <h2>Editar Produto <span id="edit-id-label"></span></h2>
            <form id="update-form">
                <input type="hidden" id="update-id">

                <div class="input-group">
                    <label for="update-barcode">Código de Barras:</label>
                    <input type="text" id="update-barcode" placeholder="Código de Barras" disabled="true">
                </div>

                <div class="input-group">
                    <label for="update-name">Nome do Produto:</label>
                    <input type="text" id="update-name" placeholder="Nome">
                </div>

                <div class="input-group">
                    <label for="update-image-url">URL da Imagem do Produto:</label>
                    <input type="text" id="update-image-url" placeholder="URL da Imagem">
                </div>

                <div class="input-group">
                    <label for="update-quantity">Quantidade no Estoque:</label>
                    <input type="number" id="update-quantity" placeholder="Quantidade">
                </div>

                <div class="input-group">
                    <label for="update-value">Valor Unitário (R$):</label>
                    <input type="number" step="0.01" id="update-value" placeholder="Valor (R$)">
                </div>

                <button type="submit" class="btn-warning">Salvar Alterações</button>
                <button type="button" class="btn-danger" onclick="cancelUpdate()">Cancelar</button>
            </form>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
